<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Viewer</title>
<style>
  :root {
    --bg: #fafaf9; --panel: #ffffff; --text: #1c1917; --muted: #78716c;
    --line: #e7e5e4; --accent: #4f46e5; --accent-soft: #eef2ff; --chip: #f1f0ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1d1c1b; --text: #f5f5f4; --muted: #a8a29e;
      --line: #2e2c2a; --accent: #a5b4fc; --accent-soft: #25243a; --chip: #292725;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 10px; }
  header h1 { font-size: 17px; margin: 0; }
  header span { color: var(--muted); font-size: 13px; }
  .app { display: grid; grid-template-columns: 230px 1fr; gap: 16px; max-width: 1180px; margin: 0 auto; padding: 16px; }
  @media (max-width: 760px) { .app { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  aside { padding: 8px; align-self: start; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 8px 8px 6px; }
  .proj { display: flex; justify-content: space-between; width: 100%; text-align: left; border: 0; background: none;
    color: inherit; font: inherit; padding: 7px 8px; border-radius: 7px; cursor: pointer; }
  .proj:hover { background: var(--chip); }
  .proj.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .proj .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  main { min-width: 0; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .tab { border: 1px solid var(--line); background: var(--panel); color: inherit; font: inherit; padding: 6px 14px;
    border-radius: 999px; cursor: pointer; }
  .tab.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { .tab.on { color: #141413; } }
  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  input[type=search], select { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 10px; }
  input[type=search] { flex: 1; min-width: 160px; }
  .card { padding: 12px 14px; margin-bottom: 10px; overflow-wrap: anywhere; }
  .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 12.5px; margin-bottom: 4px; }
  .badge { background: var(--chip); border-radius: 5px; padding: 1px 7px; color: var(--text); }
  .text { white-space: pre-wrap; }
  .tags { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { background: var(--accent-soft); color: var(--accent); border: 0; border-radius: 999px; padding: 1px 9px;
    font: inherit; font-size: 12.5px; cursor: pointer; }
  .imp { letter-spacing: 1px; color: var(--accent); }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  .stat { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; color: var(--muted); }
  .stat strong { color: var(--text); font-variant-numeric: tabular-nums; }
  input[type=range] { accent-color: var(--accent); }
  pre { margin: 0; padding: 14px; white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.55 ui-monospace, Menlo, monospace; }
  .filter { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .filter button { background: none; border: 0; color: var(--accent); cursor: pointer; font: inherit; }
</style>
</head>
<body>
<header><h1>Memory Viewer</h1><span>read-only · local</span></header>
<div class="app">
  <aside class="panel"><h2>Projects</h2><div id="projects"></div></aside>
  <main>
    <div class="tabs" id="tabs">
      <button class="tab on" data-tab="memories">Memories</button>
      <button class="tab" data-tab="handoffs">Handoffs</button>
      <button class="tab" data-tab="context">Context preview</button>
    </div>
    <div id="view"></div>
  </main>
</div>
<script>
"use strict";
const state = { project: "", kind: "", tag: "", q: "", tab: "memories", budget: 700 };
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...kids) => {
  const e = Object.assign(document.createElement(tag), props);
  for (const k of kids) e.append(k);
  return e;
};
const api = async (path, params) => {
  const u = new URLSearchParams();
  for (const [k, v] of Object.entries(params || {})) if (v) u.set(k, v);
  const r = await fetch(`/api/${path}?${u}`);
  if (!r.ok) throw new Error((await r.json()).error || r.status);
  return r.json();
};
const ago = (iso) => {
  const m = (Date.now() - new Date(iso)) / 60000;
  if (m < 1) return "just now";
  if (m < 60) return `${Math.floor(m)}m ago`;
  if (m < 1440) return `${Math.floor(m / 60)}h ago`;
  if (m < 43200) return `${Math.floor(m / 1440)}d ago`;
  return `${Math.floor(m / 43200)}mo ago`;
};
const empty = (msg) => el("div", { className: "panel empty", textContent: msg });
let timer;

async function renderProjects() {
  const list = await api("projects");
  const box = $("projects");
  box.replaceChildren();
  const total = list.reduce((s, p) => s + p.n, 0);
  for (const p of [{ project: "", n: total, label: "All projects" }, ...list]) {
    const b = el("button", { className: "proj" + (state.project === p.project ? " on" : "") },
      el("span", { textContent: p.label || p.project }), el("span", { className: "n", textContent: p.n }));
    b.onclick = () => { state.project = p.project; state.tag = ""; refresh(); };
    box.append(b);
  }
}

function toolbar() {
  const search = el("input", { type: "search", placeholder: "Search memories…", value: state.q });
  search.oninput = () => { clearTimeout(timer); timer = setTimeout(() => { state.q = search.value; renderView(); }, 200); };
  const kind = el("select");
  for (const k of ["", "fact", "preference", "decision", "task", "note"]) {
    kind.append(el("option", { value: k, textContent: k || "All kinds", selected: k === state.kind }));
  }
  kind.onchange = () => { state.kind = kind.value; renderView(); };
  return el("div", { className: "toolbar" }, search, kind);
}

function memoryCard(m) {
  const meta = el("div", { className: "meta" },
    el("span", { textContent: `#${m.id}` }),
    el("span", { className: "badge", textContent: m.kind }));
  if (!state.project) meta.append(el("span", { textContent: m.project }));
  meta.append(el("span", { className: "imp", title: `importance ${m.importance}`, textContent: "●".repeat(m.importance) }),
    el("span", { textContent: ago(m.created_at) }));
  const card = el("div", { className: "panel card" }, meta, el("div", { className: "text", textContent: m.text }));
  if (m.tags.length) {
    const tags = el("div", { className: "tags" });
    for (const t of m.tags) {
      const b = el("button", { className: "tag", textContent: "#" + t });
      b.onclick = () => { state.tag = t; renderView(); };
      tags.append(b);
    }
    card.append(tags);
  }
  return card;
}

async function renderView() {
  const view = $("view");
  view.replaceChildren();
  try {
    if (state.tab === "memories") {
      view.append(toolbar());
      if (state.tag) {
        const clear = el("button", { textContent: "clear" });
        clear.onclick = () => { state.tag = ""; renderView(); };
        view.append(el("div", { className: "filter" }, `Tag: #${state.tag} · `, clear));
      }
      const rows = await api("memories", { project: state.project, kind: state.kind, tag: state.tag, q: state.q });
      if (!rows.length) return view.append(empty(state.q ? "No matches." : "No memories yet."));
      const search = view.querySelector("input[type=search]");
      view.append(...rows.map(memoryCard));
      if (state.q) { search.focus(); search.setSelectionRange(state.q.length, state.q.length); }
    } else if (state.tab === "handoffs") {
      const rows = await api("handoffs", { project: state.project });
      if (!rows.length) return view.append(empty("No handoffs saved yet."));
      for (const h of rows) {
        const meta = el("div", { className: "meta" }, el("span", { className: "badge", textContent: h.project }),
          el("span", { textContent: h.from_model ? `from ${h.from_model}` : "" }),
          el("span", { textContent: `${ago(h.created_at)} · ${new Date(h.created_at).toLocaleString()}` }));
        view.append(el("div", { className: "panel card" }, meta, el("div", { className: "text", textContent: h.summary })));
      }
    } else {
      const range = el("input", { type: "range", min: 100, max: 4000, step: 100, value: state.budget });
      const stat = el("strong", { textContent: "…" });
      const out = el("pre");
      const load = async () => {
        const c = await api("context", { project: state.project, max_tokens: state.budget });
        stat.textContent = `${c.tokens} tokens`;
        out.textContent = c.text;
      };
      range.oninput = () => { state.budget = Number(range.value); budgetLabel.textContent = state.budget; clearTimeout(timer); timer = setTimeout(load, 120); };
      const budgetLabel = el("strong", { textContent: state.budget });
      view.append(
        el("div", { className: "stat" }, "What get_context sends for ", el("strong", { textContent: state.project || "all projects" }),
          " · used ", stat, " · cap ", budgetLabel, range),
        el("div", { className: "panel" }, out));
      await load();
    }
  } catch (e) {
    view.append(empty("Error: " + e.message));
  }
}

function refresh() { renderProjects(); renderView(); }

$("tabs").onclick = (e) => {
  const t = e.target.closest(".tab");
  if (!t) return;
  state.tab = t.dataset.tab;
  for (const b of document.querySelectorAll(".tab")) b.classList.toggle("on", b === t);
  renderView();
};
refresh();
</script>
</body>
</html>
